<h1>配字</h1>
<p class="sub">輸入一個常用字。周圍有八個字，都可以配上圖上已有的字，散開來放。每配成一個詞，還沒選的字整組換新，仍然是八個，也是圍著散開。配詞不夠多的字，就把能配的都搜出來。從起首的字可以配到第五層。後生出的字，也可以配前面已經出現的字，次序倒過來也算。拖到哪個字上，那個字會放大，配的就是那一個。再輸入同一個字，會換一組。</p>
<p class="key"><i class="swatch front"></i><span id="k-front">前面的字</span><i class="swatch back"></i><span id="k-back">後面的字</span><i class="swatch loose"></i><span id="k-loose">還沒配的字</span></p>
<p class="rule">詞語是兩個常用字固定合成一個意思，可以單獨放進一句話。兩個字只是剛好排在一起，例如「我去」，不算詞語。</p>
<form id="ask">
  <label for="seed">你們已經認識的一個字</label>
  <input id="seed" maxlength="8" placeholder="例如：生" autocomplete="off" enterkeyhint="done">
  <button type="submit">放在中間</button>
  <p class="hint">例如：生、明、行、水、人、天、心、火。</p>
</form>
<div id="world" hidden><div id="stage"></div></div>
<p id="msg"></p>
<div class="actions"><button class="ghost" id="reset" type="button" hidden>重新開始</button></div>

        const n = nodes[id];

function fitView() {

    minX = Math.min(minX, p.x - 96);
    maxX = Math.max(maxX, p.x + 96);
    minY = Math.min(minY, p.y - 70);
    maxY = Math.max(maxY, p.y + 100);
  });
  const bw = Math.max(180, maxX - minX);
  const bh = Math.max(180, maxY - minY);
  const scale = Math.min(world.clientWidth / bw, world.clientHeight / bh);
  const ox = (world.clientWidth - bw * scale) / 2 - minX * scale;
  const oy = (world.clientHeight - bh * scale) / 2 - minY * scale;
  stage.style.transformOrigin = "0 0";

function stageGeom() {

function aimAt(x, y, selfChar) {
